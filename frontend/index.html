<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e7c86" />
    <meta name="description" content="edusolutionsmaldives.com — learning, simplified." />

    <!-- iOS home-screen install support (Safari doesn't read the web manifest for this) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EduSolution" />

    <title>edusolutionsmaldives.com</title>

    <!-- Applies the dark class before the app mounts, avoiding a flash of
         the wrong theme (context/ThemeContext.jsx re-derives and keeps this
         in sync afterward, including on system-preference changes). Nothing
         stored yet defaults to light — matches ThemeContext.jsx's own
         'light' default, only 'dark' (explicit choice) or 'system' (explicit
         choice, OS currently dark) ever paint dark on first load. -->
    <script>
      (function () {
        var stored = localStorage.getItem('edusolution_theme');
        var isDark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
