services:
  - type: web
    name: edusolution-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://edusolution-frontend.onrender.com

  - type: web
    name: edusolution-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://edusolution-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
