services:
  - type: web
    name: mod-report-backend
    runtime: node
    plan: starter
    rootDir: mod-report-backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    disk:
      name: mod-report-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://mod-report.edusolutionsmaldives.com
      - key: DB_PATH
        value: /var/data/mod-report.sqlite3

  - type: web
    name: mod-report-frontend
    runtime: static
    rootDir: mod-report-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://mod-report-api.edusolutionsmaldives.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
