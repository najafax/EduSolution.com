services:
  - type: web
    name: edusolution-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    disk:
      name: edusolution-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://www.edusolutionsmaldives.com
      - key: DB_PATH
        value: /var/data/data.sqlite3

  - type: web
    name: edusolution-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://api.edusolutionsmaldives.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # MOD Report — split out of the main app above into its own deployment
  # (see mod-report-backend/README.md and mod-report-frontend/README.md).
  # Same two-service (API + static site) shape as edusolution-backend/
  # -frontend, but with its own disk, JWT secret, and login accounts — no
  # data or auth is shared with the main app. Placeholder domain values
  # below (mod-report.*, mod-report-api.*) — update CLIENT_ORIGIN/
  # VITE_API_URL once real subdomains are chosen and connected in Render.
  - type: web
    name: mod-report-backend
    runtime: node
    plan: starter
    rootDir: mod-report-backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    disk:
      name: mod-report-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://mod-report.edusolutionsmaldives.com
      - key: DB_PATH
        value: /var/data/mod-report.sqlite3

  - type: web
    name: mod-report-frontend
    runtime: static
    rootDir: mod-report-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://mod-report-api.edusolutionsmaldives.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
