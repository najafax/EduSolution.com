services:
  - type: web
    name: edusolution-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    disk:
      name: edusolution-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://www.edusolutionsmaldives.com
      - key: DB_PATH
        value: /var/data/data.sqlite3

  - type: web
    name: edusolution-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://api.edusolutionsmaldives.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
